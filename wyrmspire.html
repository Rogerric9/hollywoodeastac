<head>

<title>Wyrmspire Hall | Hollywood East Autographs &amp; Collectibles</title>

<style>
  :root{
    --bg:#100c0a;
    --surface:#1b1512;
    --surface-2:#241a16;
    --ink:#e9dcc7;
    --muted:#a3927c;
    --accent:#8c2f2f;
    --accent-2:#b98b3e;
    --line:#3a2a22;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(185,139,62,0.10), transparent 60%),
      radial-gradient(ellipse 80% 60% at 50% 100%, rgba(140,47,47,0.10), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:Arial, Helvetica, "Helvetica Neue", sans-serif;
    display:flex;
    flex-direction:column;
    padding-left:max(16px, env(safe-area-inset-left,0px));
    padding-right:max(16px, env(safe-area-inset-right,0px));
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .app{
    display:flex;
    flex-direction:column;
    height:100%;
    max-width:720px;
    width:100%;
    margin:0 auto;
    min-height:0;
  }
  header.bar{
    position:sticky;
    top:env(safe-area-inset-top,0px);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    padding:14px 4px 10px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(var(--bg), rgba(16,12,10,0.85) 80%, transparent);
    z-index:5;
    flex-wrap:wrap;
  }
  header.bar h1{
    font-family:"Cinzel", Georgia, serif;
    font-weight:700;
    font-size:clamp(18px,4vw,24px);
    letter-spacing:0.06em;
    margin:0;
    color:var(--ink);
    text-wrap:balance;
  }
  .status-pill{
    font-family:"Cinzel", Georgia, serif;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--accent-2);
    border:1px solid var(--line);
    background:var(--surface);
    padding:5px 10px;
    border-radius:999px;
    white-space:nowrap;
  }

  main#page{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    padding:26px 6px 18px;
  }

  .leaf{
    max-width:640px;
    margin:0 auto;
  }
  .leaf.turning{ animation: turnIn 380ms ease both; }
  @media (prefers-reduced-motion: reduce){
    .leaf.turning{ animation:none; }
  }
  @keyframes turnIn{
    from{ opacity:0; transform: translateY(6px) scale(0.995); }
    to{ opacity:1; transform:none; }
  }

  .page-eyebrow{
    font-family:"Cinzel", Georgia, serif;
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:6px;
  }

  .room-title{
    font-family:"Cinzel", Georgia, serif;
    font-weight:600;
    font-size:clamp(20px,4.2vw,27px);
    letter-spacing:0.04em;
    color:var(--accent-2);
    text-wrap:balance;
    margin:0 0 18px;
    padding-bottom:12px;
    border-bottom:1px solid var(--line);
  }

  .prose p{
    margin:0 0 0.9em;
    font-size:16px;
    line-height:1.68;
    max-width:70ch;
  }
  .prose p:last-child{ margin-bottom:0; }
  .prose blockquote{
    margin:0.9em 0 0.9em 0.2em;
    padding-left:14px;
    border-left:2px solid var(--accent);
    color:#f0e6d4;
    font-style:italic;
    white-space:pre-line;
  }
  .prose .system{ color:var(--muted); font-style:italic; }
  .prose .hint{ color:#e0453c; }
  .prose .jewel-found{ color:#e8c547; }
  .prose .item-quill{ color:#8ec9e0; }
  .prose .item-document{ color:#d1b26f; }
  .prose .item-button{ color:#c0c0c0; }
  .prose .item-buckle{ color:#b08d57; }
  .prose .item-bead{ color:#7fd99a; }
  .prose .item-spoon{ color:#a9b7c6; }
  .prose .item-coin{ color:#c87f32; }
  .prose .item-corkscrew{ color:#b5495b; }
  .prose .item-diary{ color:#e0a060; }
  .prose .item-banana{ color:#d6d26a; }
  .prose .xyzzy{
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing:0.02em;
  }
  .prose .diary-page{
    margin:0.9em 0;
    padding:14px 16px;
    border:1px solid var(--line);
    background:var(--surface-2);
  }
  .prose .diary-page p{
    font-family:Georgia, "Times New Roman", serif;
    font-style:italic;
    font-size:18px;
    line-height:1.9;
    color:#f0e6d4;
  }
  .prose .diary-page .diary-meta{
    display:block;
    margin-top:10px;
    font-family:"Cinzel", Georgia, serif;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--muted);
  }

  .responses{
    margin-top:22px;
  }
  .responses:empty{ margin-top:0; }
  .response-block{
    margin-top:18px;
    padding-top:16px;
    border-top:2px dashed #eddc7a;
  }

  .exits-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:10px 4px 4px;
    border-top:1px solid var(--line);
    max-width:640px;
    margin:0 auto;
    width:100%;
  }
  .chip{
    font-family:"Cinzel", Georgia, serif;
    font-size:11.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:6px;
    padding:7px 11px;
    cursor:pointer;
  }
  .chip:hover{ border-color:var(--accent-2); color:var(--accent-2); }
  .chip:focus-visible{ outline:2px solid var(--accent-2); outline-offset:2px; }
  .chip.quiet{ color:var(--muted); }
  .chip.primary{ border-color:var(--accent-2); color:var(--accent-2); }

  .auth-panel{
    max-width:640px;
    margin:0 auto;
    width:100%;
    padding:4px 6px 14px;
  }
  .auth-message{
    font-size:14px;
    color:var(--accent-2);
    min-height:1.2em;
    margin:0 0 10px;
  }
  .auth-form{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .auth-form[hidden]{
    display:none;
  }
  .auth-form label{
    display:flex;
    flex-direction:column;
    gap:4px;
    font-family:"Cinzel", Georgia, serif;
    font-size:12px;
    letter-spacing:0.04em;
    color:var(--muted);
    text-transform:uppercase;
  }
  .auth-hint{
    text-transform:none;
    letter-spacing:0;
    font-family:Arial, Helvetica, sans-serif;
    font-size:11px;
  }
  .auth-form input[type="text"],
  .auth-form input[type="email"],
  .auth-form input[type="password"],
  .auth-form input[type="text"].password-revealed,
  .auth-form textarea{
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--ink);
    font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size:15px;
    padding:10px 38px 10px 11px;
    border-radius:6px;
    width:100%;
  }
  .auth-form textarea{
    padding-right:11px;
    resize:vertical;
  }
  .prize-choices{
    border:1px solid var(--line);
    border-radius:6px;
    padding:10px 12px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .prize-choices legend{
    font-family:"Cinzel", Georgia, serif;
    font-size:12px;
    letter-spacing:0.04em;
    color:var(--muted);
    text-transform:uppercase;
    padding:0 4px;
  }
  .prize-choices label{
    flex-direction:row !important;
    align-items:center;
    text-transform:none !important;
    letter-spacing:0 !important;
    font-family:Arial, Helvetica, sans-serif !important;
    font-size:14px !important;
    color:var(--ink) !important;
    gap:8px !important;
  }
  .auth-form input:focus-visible{ outline:2px solid var(--accent-2); outline-offset:1px; }
  .password-field{
    position:relative;
    display:block;
  }
  .password-toggle{
    position:absolute;
    right:4px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    cursor:pointer;
    font-size:16px;
    line-height:1;
    padding:6px;
    color:var(--muted);
  }
  .password-toggle:hover{ color:var(--accent-2); }
  .password-toggle:focus-visible{ outline:2px solid var(--accent-2); outline-offset:1px; }
  .auth-remember{
    flex-direction:row !important;
    align-items:center;
    text-transform:none !important;
    letter-spacing:0 !important;
    font-family:Arial, Helvetica, sans-serif !important;
    font-size:13px !important;
    color:var(--ink) !important;
    gap:8px !important;
  }
  .auth-form button[type="submit"]{
    font-family:"Cinzel", Georgia, serif;
    font-size:13px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    background:var(--accent);
    color:#f4e9d8;
    border:1px solid #a5453f;
    border-radius:6px;
    padding:10px 16px;
    cursor:pointer;
  }
  .auth-form button[type="submit"]:hover{ background:#a5453f; }
  .auth-switch{
    font-size:13px;
    color:var(--muted);
    margin:2px 0 0;
  }
  .auth-switch a{ color:var(--accent-2); }

  form#inputBar{
    display:flex;
    gap:8px;
    padding:10px 4px max(10px, env(safe-area-inset-bottom,0px));

    background:linear-gradient(rgba(16,12,10,0.6), var(--bg) 30%);

    margin:0 auto;
    width:100%;
  }
  #cmdInput{
    flex:1 1 auto;
    min-width:0;
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--ink);
    font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size:15px;
    padding:11px 12px;
    border-radius:6px;
  }
  #cmdInput:focus-visible{ outline:2px solid var(--accent-2); outline-offset:1px; }
  #inputBar button{
    font-family:"Cinzel", Georgia, serif;
    font-size:13px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    background:var(--accent);
    color:#f4e9d8;
    border:1px solid #a5453f;
    border-radius:6px;
    padding:0 16px;
    cursor:pointer;
  }
  #inputBar button:hover{ background:#a5453f; }

  @media (prefers-reduced-motion:no-preference){
    .glow{ animation:flicker 7s ease-in-out infinite; }
  }
  @keyframes flicker{
    0%,100%{ opacity:1; } 45%{ opacity:0.93; } 50%{ opacity:1; } 78%{ opacity:0.96; }
  }
</style>

<body>

<div class="app glow">
  <header class="bar">
    <h1>Wyrmspire Hall</h1>
    <span class="status-pill" id="statusPill">Spells broken: 0 / 10</span>
  </header>
  <main id="page" aria-live="polite">
    <div class="leaf" id="leaf">
      <div class="page-eyebrow" id="pageEyebrow"></div>
      <h2 class="room-title" id="pageTitle"></h2>
      <div class="prose" id="pageProse"></div>
      <div class="prose responses" id="pageResponses"></div>
    </div>
  </main>

  <section id="authPanel" class="auth-panel" hidden>
    <p class="auth-message" id="authMessage" aria-live="polite"></p>

    <form id="signupForm" class="auth-form">
      <label>Avatar name
        <input type="text" name="avatar_name" autocomplete="username" minlength="3" maxlength="20" required />
      </label>
      <label>Email <span class="auth-hint">(for account recovery only)</span>
        <input type="email" name="email" autocomplete="email" required />
      </label>
      <label>Password
        <span class="password-field"><input type="password" name="password" autocomplete="new-password" minlength="8" maxlength="128" required /><button type="button" class="password-toggle" aria-label="Show password">👁</button></span>
      </label>
      <label>Confirm password
        <span class="password-field"><input type="password" name="confirm_password" autocomplete="new-password" minlength="8" maxlength="128" required /><button type="button" class="password-toggle" aria-label="Show password">👁</button></span>
      </label>
      <label class="auth-remember"><input type="checkbox" name="remember" checked /> Remember me on this device</label>
      <button type="submit">Sign the rolls</button>
      <p class="auth-switch">Returning traveller? <a href="#" data-auth-view="login">Sign in</a></p>
    </form>

    <form id="loginForm" class="auth-form" hidden>
      <label>Avatar name
        <input type="text" name="avatar_name" autocomplete="username" required />
      </label>
      <label>Password
        <span class="password-field"><input type="password" name="password" autocomplete="current-password" required /><button type="button" class="password-toggle" aria-label="Show password">👁</button></span>
      </label>
      <label class="auth-remember"><input type="checkbox" name="remember" checked /> Remember me on this device</label>
      <button type="submit">Sign in</button>
      <p class="auth-switch">
        <a href="#" data-auth-view="forgotName">Forgot name?</a> ·
        <a href="#" data-auth-view="forgotPassword">Forgot password?</a><br>
        New here? <a href="#" data-auth-view="signup">Sign the rolls</a>
      </p>
    </form>

    <form id="forgotNameForm" class="auth-form" hidden>
      <label>Email
        <input type="email" name="email" autocomplete="email" required />
      </label>
      <button type="submit">Send name reminder</button>
      <p class="auth-switch"><a href="#" data-auth-view="login">Back to sign in</a></p>
    </form>

    <form id="forgotPasswordForm" class="auth-form" hidden>
      <label>Avatar name or email
        <input type="text" name="identifier" required />
      </label>
      <button type="submit">Send reset link</button>
      <p class="auth-switch"><a href="#" data-auth-view="login">Back to sign in</a></p>
    </form>

    <form id="resetPasswordForm" class="auth-form" hidden>
      <label>New password
        <span class="password-field"><input type="password" name="password" autocomplete="new-password" minlength="8" maxlength="128" required /><button type="button" class="password-toggle" aria-label="Show password">👁</button></span>
      </label>
      <label>Confirm new password
        <span class="password-field"><input type="password" name="confirm_password" autocomplete="new-password" minlength="8" maxlength="128" required /><button type="button" class="password-toggle" aria-label="Show password">👁</button></span>
      </label>
      <button type="submit">Set new password</button>
    </form>
  </section>

  <section id="prizeClaimPanel" class="auth-panel" hidden>
    <p class="auth-message" id="prizeClaimMessage" aria-live="polite"></p>
    <form id="prizeClaimForm" class="auth-form">
      <p>You have broken every spell in Wyrmspire Hall. Choose the prize you would like to claim, and tell us where to send it.</p>
      <fieldset class="prize-choices">
        <legend>Choose your prize</legend>
        <label><input type="radio" name="selected_prize" value="Prize 1" required /> Prize 1</label>
        <label><input type="radio" name="selected_prize" value="Prize 2" /> Prize 2</label>
        <label><input type="radio" name="selected_prize" value="Prize 3" /> Prize 3</label>
        <label><input type="radio" name="selected_prize" value="Prize 4" /> Prize 4</label>
        <label><input type="radio" name="selected_prize" value="Prize 5" /> Prize 5</label>
      </fieldset>
      <label>Your full name
        <input type="text" name="winner_name" autocomplete="name" minlength="2" maxlength="120" required />
      </label>
      <label>Mailing address
        <textarea name="mailing_address" rows="3" maxlength="500" required></textarea>
      </label>
      <button type="submit">Claim Prize</button>
    </form>
  </section>

  <div class="exits-row" id="exitsRow"></div>
  <form id="inputBar" autocomplete="off">
    <input id="cmdInput" name="cmd" type="text" placeholder="What will you do?" autocomplete="off" autocapitalize="off" spellcheck="false" />
    <button type="submit">Send</button>
  </form>
</div>

  function paragraphize(lines){
    return lines.map(function(l){
      if (/^<(blockquote|div)/.test(l)) return l;
      return "<p>" + l + "</p>";
    }).join("");

  function numberWord(n){
    return NUMBER_WORDS[n] !== undefined ? NUMBER_WORDS[n] : String(n);
  }
  function joinWithAnd(arr){
    if (arr.length === 1) return arr[0];
    if (arr.length === 2) return arr[0] + " and " + arr[1];
    return arr.slice(0,-1).join(", ") + ", and " + arr[arr.length-1];
  }

    return (solved.ogre?1:0) + (solved.dial?1:0) + (solved.helmets?1:0) + (solved.chest?1:0) + (solved.document?1:0) + (solved.mirrors?1:0) + (solved.magpie?1:0) + (solved.wine?1:0) + (solved.well?1:0) + (solved.finale?1:0);
  }

    return JEWEL_KEYS.filter(function(k){ return inventory[k]; });

    return jewelKeysHeld().length === 9;

    return JEWEL_KEYS.every(function(k){ return inventory[k] || placed[k]; });

    var remaining = TOTAL_SPELLS - solvedCount();
    if (remaining <= 0) return "All spells are broken";
    if (remaining === 1) return "Only one remains";

    }

  // If the noun was already mentioned in this room's own description, surface
  // the sentence that mentioned it instead of claiming there's nothing there.
  function describedElsewhere(noun){
    var room = ROOMS[current];
    if (!room.desc) return null;
    var descLines = (typeof room.desc === "function") ? room.desc() : room.desc;
    var escaped = noun.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    var wordPattern = new RegExp("\\b" + escaped + "s?\\b", "i");
    for (var i=0;i<descLines.length;i++){
      var plain = descLines[i].replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
      if (!wordPattern.test(plain)) continue;
      var sentences = plain.match(/[^.!?]+[.!?]+/g) || [plain];
      for (var j=0;j<sentences.length;j++){
        if (wordPattern.test(sentences[j])) return sentences[j].trim();
      }
      return plain;
    }
    return null;
  }

  function tryExamine(raw){
    var m = raw.match(/^(?:examine|x|look at|read|inspect)\s+(?:the\s+)?(.+)$/i);
    if (!m) return false;
    var noun = m[1].trim().toLowerCase();
    var room = ROOMS[current];
    if (room.examine){
      var keys = Object.keys(room.examine);
      for (var i=0;i<keys.length;i++){
        var pattern = new RegExp("^(" + keys[i] + ")$", "i");
        if (pattern.test(noun)){
          var val = room.examine[keys[i]];
          var lines = (typeof val === "function") ? val() : val;
          respond(lines);
          return true;
        }
      }
    }
    // Recognized EXAMINE-style command, but nothing special defined for this
    // noun — if the room's own description already mentioned it, repeat that
    // instead of claiming there's nothing there.
    var already = describedElsewhere(noun);
    respond([already || "Nothing interesting here."]);
    return true;
  }

  function saveProgressToServer(reason){
    if (!avatarName || !saveToken) return Promise.resolve({ok:false, code:"no_identity"});
    var payload = JSON.stringify({
      avatar_name: avatarName,
      save_token: saveToken,
      current_room: current,
      inventory: inventory,
      solved: solved,
      placed: placed,
      flags: buildCurrentFlags(),
      reason: reason
    });

    if (reason === "pagehide" && navigator.sendBeacon){
      try {
        var blob = new Blob([payload], {type:"text/plain"});
        var sent = navigator.sendBeacon(API_BASE + "/wyrmspire-save-progress", blob);
        return Promise.resolve({ok:sent, code:null});
      } catch(e){
        return Promise.resolve({ok:false, code:"network_error"});
      }
    }

    var fetchOptions = {
      method: "POST",
      headers: {"Content-Type": reason === "pagehide" ? "text/plain" : "application/json"},
      body: payload
    };
    if (reason === "pagehide") fetchOptions.keepalive = true;

    return fetch(API_BASE + "/wyrmspire-save-progress", fetchOptions)
      .then(function(res){ return res.json(); })
      .then(function(data){
        if (data && data.code === "not_authorized"){
          saveToken = null;
          clearStoredIdentity();
          return {ok:false, code:"not_authorized"};
        }
        return {ok: Boolean(data && data.success), code: (data && data.code) || null};
      })
      .catch(function(){ return {ok:false, code:"network_error"}; });
  }

  function resolveResumeRoom(state){
    var roomId = state && state.current_room;
    if (!roomId || !ROOMS[roomId] || roomId === "intro" || roomId === "xyzzy_well"){
      return "gate";
    }
    var jewelsDone = JEWEL_KEYS.every(function(k){ return inventory[k] || placed[k]; });
    if ((roomId === "tower_stair" || roomId === "tower_door" || roomId === "king_chamber") && !jewelsDone){
      return "great_hall";
    }
    if (roomId === "treasure_room" && !solved.finale){
      return "great_hall";
    }
    return roomId;
  }

  function restoreGameState(state, greetingLines){
    state = state || {};
    copyKnownKeys(solved, state.solved, SOLVED_KEYS);
    copyKnownKeys(inventory, state.inventory, JEWEL_KEYS);
    copyKnownKeys(placed, state.placed, JEWEL_KEYS);
    jewelsPlaced = JEWEL_KEYS.filter(function(k){ return placed[k]; }).length;
    applyFlags(state.flags);
    prizeClaimed = Boolean(state.prize_claimed);

    var room = resolveResumeRoom(state);
    visited = ["intro"];
    mode = "play";
    reAuthInProgress = false;
    authRevokedNoticeShown = false;
    hideAuthPanel();
    renderStatusPill();
    turnTo(room, greetingLines);
    maybeShowPrizeClaimPanel();
  }

  function showAuthView(view, message, prefillName){
    authView = view;
    mode = "auth";
    authBusy = false;
    authPanel.hidden = false;
    form.hidden = true;
    Object.keys(AUTH_FORMS).forEach(function(key){
      AUTH_FORMS[key].hidden = (key !== view);
    });
    authMessageEl.textContent = message || "";
    if (prefillName){
      var nameField = AUTH_FORMS[view].querySelector("[name=avatar_name]");
      if (nameField) nameField.value = prefillName;
    }
    renderExits();
  }

  function hideAuthPanel(){
    authPanel.hidden = true;
    form.hidden = false;
    authMessageEl.textContent = "";
  }

  function maybeShowPrizeClaimPanel(){
    if (solved.finale && !prizeClaimed && mode === "play"){
      mode = "claimPrize";
      prizeClaimPanel.hidden = false;
      form.hidden = true;
      prizeClaimMessageEl.textContent = "";
      renderExits();
    }
  }

  function hidePrizeClaimPanel(){
    prizeClaimPanel.hidden = true;
    form.hidden = false;
    prizeClaimMessageEl.textContent = "";
  }

  function setAuthBusy(isBusy, busyMessage){
    authBusy = isBusy;
    if (isBusy) authMessageEl.textContent = busyMessage || "One moment...";
  }

  function applyAuthSuccess(data, remember, greetingLines){
    avatarName = data.avatar_name;
    if (data.save_token) saveToken = data.save_token;
    storeIdentity(avatarName, saveToken, remember);

    if (reAuthInProgress){
      reAuthInProgress = false;
      authRevokedNoticeShown = false;
      hideAuthPanel();
      renderRoom(current);
      respond(["Your seal is renewed. " + (greetingLines ? greetingLines.join(" ") : "")]);
      saveProgressToServer("relogin");
      return;
    }
    restoreGameState(data.state, greetingLines);
  }

  function showAuthChoice(){
    mode = "authChoice";
    renderRoom("naming");
  }

  function proceedToNaming(){
    var stored = loadStoredIdentity();
    if (!stored){
      showAuthChoice();
      return;
    }
    avatarName = stored.avatarName;
    saveToken = stored.saveToken;
    mode = "auth";
    renderRoom("naming");
    respond(["The herald peers at your seal..."]);
    postWyrmspire("/wyrmspire-resume", {avatar_name: avatarName, save_token: saveToken}).then(function(result){
      if (result.ok){
        restoreGameState(result.data.state, ["The herald finds <strong>" + escapeHtml(result.data.avatar_name) + "</strong> in his rolls and waves you back to where you left off."]);
      } else {
        avatarName = null;
        saveToken = null;
        clearStoredIdentity();
        showAuthView("login", "Your seal is no longer recognised — please sign in.", stored.avatarName);
      }
    });
  }


  function beginReAuth(view){
    reAuthInProgress = true;
    showAuthView(view || "login", "", avatarName);
  }

  function finishExit(){
    respond(["Farewell, traveller. The hall will remember."]);
    setTimeout(function(){
      window.location.href = "index.html";
    }, 1200);
  }

  function performExitSave(){
    mode = "saving";
    respond(["A raven takes wing, bearing your record away..."]);
    renderExits();
    if (!avatarName){
      finishExit();
      return;
    }
    saveProgressToServer("exit").then(function(result){
      if (result.ok){
        finishExit();
      } else if (result.code === "not_authorized" || result.code === "no_identity"){
        mode = "saveAuthExpired";
        respond(["The raven finds no one left to receive it — your seal is no longer recognised. Sign in again to keep your record, or leave without saving."]);
        renderExits();
      } else {
        mode = "saveFailed";
        respond(["The raven returns, your message undelivered. Something has gone amiss."]);
        renderExits();
      }
    });
  }

  function runCommand(raw){
    raw = (raw || "").trim();
    if (!raw) return;
    var low = raw.toLowerCase();

    if (mode === "authChoice"){
      if (/^sign in$/.test(low)){
        showAuthView("login");
      } else if (/^create account$/.test(low)){
        showAuthView("signup");
      } else {
        respond(["Sign in, or create an account?"]);
      }
      return;
    }

    if (mode === "auth"){
      respond(["Use the herald's ledger below."]);
      return;
    }

    if (mode === "confirmExit"){
      if (/^(leave|yes|y)$/.test(low)){
        performExitSave();
      } else if (/^(stay|no|n|cancel)$/.test(low)){
        mode = "play";
        respond(["You decide to stay a while longer."]);
        renderExits();
      } else {
        respond(["Leave, or stay?"]);
      }
      return;
    }

    if (mode === "saving"){
      respond(["The raven is already away. Wait a moment."]);
      return;
    }

    if (mode === "saveFailed"){
      if (/^(try again|retry)$/.test(low)){
        performExitSave();
      } else if (/^(leave anyway)$/.test(low)){
        window.location.href = "index.html";
      } else if (/^(stay|no|n|cancel)$/.test(low)){
        mode = "play";
        respond(["You decide to stay a while longer."]);
        renderExits();
      } else {
        respond(["Try again, leave anyway, or stay?"]);
      }
      return;
    }

    if (mode === "saveAuthExpired"){
      if (/^(sign in|sign in|login|log in)$/.test(low)){
        beginReAuth("login");
      } else if (/^(leave anyway)$/.test(low)){
        window.location.href = "index.html";
      } else if (/^(stay|no|n|cancel)$/.test(low)){
        mode = "play";
        respond(["You decide to stay a while longer."]);
        renderExits();
      } else {
        respond(["Sign in, leave anyway, or stay?"]);
      }
      return;
    }

    if (current !== "intro" && mode === "play" && /^(sign in|sign-in|login|log in)$/.test(low)){
      beginReAuth("login");
      return;
    }

    if (current !== "intro" && mode === "play" && /^(sign out|sign-out|logout|log out)$/.test(low)){
      respond(["A raven takes wing, bearing your record home before you go..."]);
      saveProgressToServer("exit").then(function(){
        clearStoredIdentity();
        respond(["You sign out. The herald's rolls will not remember you until you sign in again."]);
        setTimeout(function(){
          window.location.reload();
        }, 1200);
      });
      return;
    }

    if (current !== "intro" && mode === "play" && /^restart$/.test(low)){
      restartGame();
      return;
    }

    if (current !== "intro" && mode === "play" && /^(exit|quit|leave)$/.test(low)){
      mode = "confirmExit";
      if (avatarName){
        respond(["Continuing will exit you from the game. Your deeds so far are recorded under the name " + escapeHtml(avatarName) + "."]);
      } else {
        respond(["Continuing will exit you from the game. This session was never recorded under any name."]);
      }
      renderExits();
      return;
    }

    if (current === "xyzzy_well" && Object.prototype.hasOwnProperty.call(LOCATION_NAMES, low)){
      respond(["I don't know what you are talking about."]);
      return;
    }

    if (current !== "intro" && current !== "xyzzy_well" && Object.prototype.hasOwnProperty.call(LOCATION_NAMES, low)){
      turnTo(LOCATION_NAMES[low]);
      return;
    }

    if (current === "intro"){
      if (/^(begin|start)$/.test(low)){
        proceedToNaming();
      } else {
        respond(["Type BEGIN when you are ready, or use the button below."]);
      }
      return;
    }

    if (low === "plugh"){
      respond(["You wish!"]);
      return;
    }

    if (low === "xyzzy"){
      if (current === "xyzzy_well"){
        var returnTo = xyzzyReturnRoom || "gate";
        xyzzyReturnRoom = null;
        renderRoom(returnTo);
      } else {
        xyzzyReturnRoom = current;
        renderRoom("xyzzy_well");
      }
      return;
    }

    if (/^(help|\?)$/.test(low)){ showHelp(); return; }
    if (/^(puzzles|status)$/.test(low)){ showPuzzles(); return; }
    if (/^(?:look|l|look around|(?:examine|x|look at|inspect)\s+(?:the\s+)?room)$/.test(low)){ renderRoom(current); return; }
    if (/^(inventory|inv|i)$/.test(low)){
      var heldKeys = Object.keys(inventory).filter(function(k){ return inventory[k]; });
      var extras = [];
      if (quillTaken) extras.push("<span class=\"item-quill\">a quill</span>");
      if (documentTaken) extras.push("<span class=\"item-document\">a document</span>");
      if (buttonTaken) extras.push("<span class=\"item-button\">a button</span>");
      if (buckleTaken) extras.push("<span class=\"item-buckle\">a buckle</span>");
      if (beadTaken) extras.push("<span class=\"item-bead\">a bead</span>");
      if (spoonTaken) extras.push("<span class=\"item-spoon\">a spoon</span>");
      if (coinTaken) extras.push("<span class=\"item-coin\">a coin</span>");
      if (corkscrewTaken) extras.push("<span class=\"item-corkscrew\">a corkscrew</span>");
      if (diaryTaken) extras.push("<span class=\"item-diary\">a diary</span>");
      if (bananaTaken) extras.push("<span class=\"item-banana\">a banana</span>");
      var invLine;
      if (heldKeys.length === 0){
        invLine = extras.length ? ("You are carrying " + joinWithAnd(extras)) : "You are carrying nothing of note — not yet";
      } else if (heldKeys.length === 1){
        invLine = "You are carrying <span class=\"jewel-found\">one jewel</span>";
        if (extras.length) invLine += " — and " + joinWithAnd(extras);
      } else {
        invLine = "You are carrying <span class=\"jewel-found\">" + numberWord(heldKeys.length) + " jewels</span>";
        if (extras.length) invLine += " — and " + joinWithAnd(extras);
      }
      respond([invLine + "."]);
      return;
    }
    if (low === "back" || low === "return"){
      if (current === "xyzzy_well"){
        respond(["There is nowhere to go from here but back the way you came — say XYZZY."]);
      } else {
        goBack();
      }
      return;
    }
    var magpieRevealed = Object.keys(atriumSeen).length >= 5;
    if (current === "atrium_n" && !solved.magpie && magpieRevealed && /^(?:take|get|grab)\s+(?:the\s+)?jewel$/.test(low)){
      respond(["The magpie sidles back along the trellis, keeping the same careful distance, jewel still fast in her beak. She is not simply going to let you take it."]);
      return;
    }
    if (/^(take|get|grab)\s+(the\s+)?jewel$/.test(low)){ takeJewel(); return; }

    var giveMatch = low.match(/^(?:give|offer|throw|toss|hand|pass)\s+(?:the\s+)?(\w+)\s+(?:to|at)\s+(?:the\s+)?(?:magpie|bird|her)$/) ||
                    low.match(/^(?:give|offer|throw|toss|hand|pass)\s+(?:the\s+)?(?:magpie|bird|her)\s+(?:the\s+)?(\w+)$/);
    if (current === "atrium_n" && giveMatch && !magpieRevealed && !solved.magpie){
      respond(["There is no magpie here."]);
      return;
    }
    if (current === "atrium_n" && giveMatch){
      var offeredItem = giveMatch[1];
      if (solved.magpie){
        respond(["She is gone, and has no further interest in anything you carry."]);
      } else if (/^jewels?$/.test(offeredItem)){
        respond(["No, Fool! You need this!"]);
      } else if (!OFFERABLE_ITEMS.hasOwnProperty(offeredItem) || !OFFERABLE_ITEMS[offeredItem]()){
        respond(["You have no such thing to offer."]);
      } else if (offeredItem === "quill"){
        quillTaken = false;
        solved.magpie = true;
        updateStatus();
        respond([
          "The magpie's head cocks, sharp and sudden, the moment she sees the quill. She drops the jewel without ceremony, snatches the feather from your offered hand before you've quite finished offering it, and is gone in a single clattering burst of wings, already far more interested in her new prize than in you.",
          "<span class=\"system\">— Spell broken: the Atrium — " + remainingLine() + " —</span>",
          "<span class=\"jewel-found\">The jewel she dropped lies glinting in the dust behind her.</span>"
        ]);
      } else {
        respond(["The magpie regards the " + ITEM_DISPLAY_NAME[offeredItem] + " with evident disdain, and does not so much as shift her grip on the jewel. Whatever she wants, this plainly isn't it."]);
      }
      return;
    }

    var dropMatch = low.match(/^drop\s+(?:the\s+)?(.+)$/);
    if (dropMatch){
      var dropNoun = dropMatch[1].trim();
      if (/^jewels?$/.test(dropNoun)){
        respond(["No, Fool! You need this!"]);
        return;
      }
      var dropKey = ITEM_NOUN_TO_KEY[dropNoun];
      if (dropKey){
        if (!getItemTaken(dropKey)){
          respond(["You have no " + ITEM_DISPLAY_NAME[dropKey] + " to set down."]);
        } else {
          setItemTaken(dropKey, false);
          itemLocation[dropKey] = current;
          saveMilestoneIfSignedIn();
          respond(["You set the " + ITEM_DISPLAY_NAME[dropKey] + " down."]);
        }
        return;
      }
    }

    var takeQuillMatch = /^(?:take|get|grab)\s+(?:the\s+)?quill$/.test(low);
    if (current === "gallery" && takeQuillMatch && itemLocation.quill === "gallery"){
      if (quillTaken){
        respond(["You already have it."]);
      } else {
        quillTaken = true;
        saveMilestoneIfSignedIn();
        renderRoom(current);
        respond(["OK."]);
      }
      return;
    }

    var playMatch = /^play\s+(?:the\s+)?(.+)$/.test(low);
    if (current === "music_room" && playMatch){
      respond(["You press a key, pluck a string, whatever seems fitting — and nothing happens beyond the ordinary, dull thud of old wood and older strings. Whatever music once thrived in this room, it is not yours to call forth."]);
      return;
    }

    var knockOrOpenDoorMatch = /^(?:open|knock on|knock)\s*(?:the\s+)?door$/.test(low);
    if (current === "tower_door" && knockOrOpenDoorMatch){
      respond(["The door already stands open."]);
      return;
    }

    var placeJewelMatch = /^(?:place|insert|set|put|fit)\s+(?:a\s+|the\s+next\s+|next\s+|the\s+)?jewel(?:\s+(?:in|into)\s+(?:the\s+)?(?:crown|setting|socket))?$/.test(low);
    if (current === "king_chamber" && placeJewelMatch){
      if (solved.finale){
        respond(["The crown is whole now. There is nothing left to place."]);
        return;
      }
      var held = jewelKeysHeld();
      if (held.length === 0){
        respond(["You have no jewel left to place."]);
        return;
      }
      inventory[held[0]] = false;
      placed[held[0]] = true;
      jewelsPlaced = JEWEL_KEYS.filter(function(k){ return placed[k]; }).length;
      var placeLine = jewelsPlaced === 1 ? "The first jewel settles into its place."
        : (jewelsPlaced === 9 ? "The final jewel finds its home." : "The next jewel settles into its place.");
      if (jewelsPlaced < 9){
        respond([placeLine, EMOTION_LINES[jewelsPlaced - 1]]);
      } else {
        solved.finale = true;
        updateStatus();
        respond([
          placeLine,
          "Something far away shrieks mournfully. The King's eyes open.",
          "He rises — not slowly, not as a man long weakened would rise, but all at once, as though he had merely been waiting — and motions you back with a single raised hand. “Stand aside, Friend. I will take it from here.”",
          "“By blood and by crown, I reclaim what is mine.” The King raises a royal fist in the air and proclaims with a shout that vibrates the entire chamber, “Begone, foul demon, to the vile pit from which you arose!”",
          "A heavy oppression that had permeated the entire manor lifts. It simply ceases, the way a held breath ceases once finally released.",
          "As you and the King dance the dance of victory, the sound of great leathery wings reaches you, faint and then fainter, receding into the night.",
          "As the dance subsides, the King takes your arm and points to a door, previously unnoticed, set into the chamber's far wall. “Come,” he says. “There is one thing more I would show you.”",
          "<span class=\"system\">— Spell broken: the Tower — " + remainingLine() + " —</span>"
        ]);
        maybeShowPrizeClaimPanel();
      }
      return;
    }

    var goToCreekMatch = /^(?:go\s+to|walk\s+to|visit|approach)\s+(?:the\s+)?creek$/.test(low);
    if (current === "footpath" && goToCreekMatch){
      respond(["You find nothing remarkable about the creek."]);
      return;
    }

    var wishMatch = low.match(/^(?:i\s+)?wish\s+for\s+(?:the\s+|a\s+|an\s+)?(.+)$/) || low.match(/^make\s+a\s+wish\s+for\s+(?:the\s+|a\s+|an\s+)?(.+)$/);
    if (current === "cellar" && wishMatch){
      awaitingWish = false;
      grantWishIfValid(wishMatch[1]);
      return;
    }
    if (current === "cellar" && /^(?:make\s+a\s+wish|wish)$/.test(low)){
      awaitingWish = true;
      respond(["Wish for what?"]);
      return;
    }

    var examineBottleMatch = low.match(/^(?:examine|x|look at|read|inspect)\s+(?:the\s+)?bottle(?:\s+(\d{3,4}))?$/);
    if (current === "dining_hall" && examineBottleMatch){
      var examYear = examineBottleMatch[1];
      if (!examYear){
        respond(["“There are vintages here from every year since 1050. Which year are you interested in?”"]);
      } else if (examYear === "1347"){
        heldBottleYear = 1347;
        respond(["As you remove the bottle from the shelf, it emits a tiny tinkling sound."]);
      } else {
        respond([WINE_FLAVOR_LINES[Math.floor(Math.random() * WINE_FLAVOR_LINES.length)]]);
      }
      return;
    }

    var bottleActionMatch = low.match(/^(?:open|take|get|grab|break)\s+(?:the\s+)?bottle(?:\s+(\d{3,4}))?$/);
    if (current === "dining_hall" && bottleActionMatch){
      var actYear = bottleActionMatch[1] || (heldBottleYear ? String(heldBottleYear) : null);
      if (!actYear){
        respond(["Which bottle do you mean?"]);
      } else if (actYear !== "1347"){
        respond(["Nothing there."]);
      } else if (!corkscrewTaken){
        respond(["“With what?”"]);
      } else if (wineOpened){
        respond(["The bottle already stands open, uncorked and waiting."]);
      } else {
        wineOpened = true;
        saveMilestoneIfSignedIn();
        respond(["The cork gives way with a dry, tired squeak, centuries of pressure finally relieved. Whatever was sealed inside, air reaches it now for the first time in longer than anyone left alive could say."]);
      }
      return;
    }

    var rummageMatch = /^(?:rummage|search)(?:\s+(?:through|in))?\s+(?:the\s+)?(?:utensils?|flatware)?\s*drawer$/.test(low);
    if (current === "dining_hall" && rummageMatch){
      if (corkscrewTaken){
        respond(["The drawer holds nothing else of use now."]);
      } else if (itemLocation.corkscrew !== "dining_hall"){
        respond(["The drawer holds nothing else of use now."]);
      } else {
        corkscrewRevealed = true;
        respond(["Among the jumbled flatware, half-buried beneath tarnished forks and spoons, you find a corkscrew."]);
      }
      return;
    }

    var takeCorkscrewMatch = /^(?:take|get|grab)\s+(?:the\s+)?corkscrew$/.test(low);
    if (current === "dining_hall" && takeCorkscrewMatch && itemLocation.corkscrew === "dining_hall" && corkscrewRevealed){
      if (corkscrewTaken){ respond(["You already have it."]); }
      else { corkscrewTaken = true; saveMilestoneIfSignedIn(); renderRoom(current); respond(["OK."]); }
      return;
    }

    var pourWineMatch = /^pour\s+(?:out\s+)?(?:the\s+)?(?:bottle|wine)$/.test(low);
    var drinkWineMatch = /^drink\s+(?:the\s+)?(?:bottle|wine)$/.test(low);
    if (current === "dining_hall" && (pourWineMatch || drinkWineMatch)){
      if (!wineOpened){
        respond(["There is no open bottle here to do that with."]);
      } else if (solved.wine){
        respond(["The bottle is empty now."]);
      } else {
        solved.wine = true;
        updateStatus();
        if (pourWineMatch){
          respond([
            "You tip the bottle and let the wine spill out in a slow, dark stream across the stone.",
            "<span class=\"system\">— Spell broken: the Dining Hall — " + remainingLine() + " —</span>",
            "<span class=\"jewel-found\">Catching what little light reaches this corner of the room, a jewel rings out as it strikes the floor.</span>"
          ]);
        } else {
          respond([
            "You raise the bottle and drink. The wine has gone to something closer to vinegar than wine across four centuries uncorked — and before you've even registered the taste, something hard and cold meets your teeth.",
            "<span class=\"system\">— Spell broken: the Dining Hall — " + remainingLine() + " —</span>",
            "<span class=\"jewel-found\">You spit, more reflex than decision, and a jewel clatters free across the floor.</span>"
          ]);
        }
      }
      return;
    }

    var takeButtonMatch = /^(?:take|get|grab)\s+(?:the\s+)?button$/.test(low);
    if (current === "churchyard" && takeButtonMatch && itemLocation.button === "churchyard"){
      if (buttonTaken){ respond(["You already have it."]); }

      return;
    }

    var takeBuckleMatch = /^(?:take|get|grab)\s+(?:the\s+)?buckle$/.test(low);
    if (current === "armory" && takeBuckleMatch && itemLocation.buckle === "armory"){
      if (buckleTaken){ respond(["You already have it."]); }
      else { buckleTaken = true; saveMilestoneIfSignedIn(); renderRoom(current); respond(["OK."]); }
      return;
    }

    var takeBeadMatch = /^(?:take|get|grab)\s+(?:the\s+)?(?:bead|jade)$/.test(low);
    if (current === "muster_hall" && takeBeadMatch && itemLocation.bead === "muster_hall"){
      if (beadTaken){ respond(["You already have it."]); }
      else { beadTaken = true; saveMilestoneIfSignedIn(); renderRoom(current); respond(["OK."]); }
      return;
    }

    var takeSpoonMatch = /^(?:take|get|grab)\s+(?:the\s+)?spoon$/.test(low);
    if (current === "kitchen" && takeSpoonMatch && itemLocation.spoon === "kitchen"){
      if (spoonTaken){ respond(["You already have it."]); }
      else { spoonTaken = true; saveMilestoneIfSignedIn(); renderRoom(current); respond(["OK."]); }
      return;
    }

    var takeCoinMatch = /^(?:take|get|grab)\s+(?:the\s+)?coin$/.test(low);
    if (current === "great_hall" && takeCoinMatch && itemLocation.coin === "great_hall"){
      if (coinTaken){ respond(["You already have it."]); }

    }

    var takeDocumentMatch = /^(?:take|get|grab)\s+(?:the\s+)?(?:document|paper|deed|scroll)$/.test(low);
    if (current === "gallery" && takeDocumentMatch && itemLocation.document === "gallery"){
      if (documentTaken){
        respond(["You already have it."]);
      } else {
        documentTaken = true;
        saveMilestoneIfSignedIn();
        renderRoom(current);
        respond(["OK."]);
      }

    }

    var crowtherMatch = /^(?:take|get|grab|pull|move)\s+(?:the\s+)?crowther(?:'s)?(?:\s+frame)?$/.test(low);
    if (current === "gallery" && crowtherMatch){
      if (galleryFrameOpened){
        respond([diaryTaken
          ? "The hidden frame still hangs open, the ruined portrait and its corroded nameplate plain to see — the recess beside it empty now."
          : "The hidden frame already hangs open, the ruined portrait and its corroded nameplate plain to see — the small diary tucked beside it, just as you left it."]);
      } else {
        galleryFrameOpened = true;
        saveMilestoneIfSignedIn();
        respond([
          "You reach for the frame, meaning only to lift it and look behind — and find, the moment your hand closes on it, that it is not merely hung but hinged. It swings aside at your touch, and behind it, fitted into a recess cut for exactly this purpose, hangs another frame purposely hidden from view.",
          "The portrait on that hidden frame has been slashed through, again and again, the face cut with a violence the rest of the gallery's neglect never once matched — as though someone wanted not merely to forget the subject, but to make forgetting impossible to undo.",
          "Beneath the ruined visage, a nameplate, untouched, hidden as carefully as the man himself — though even here, time or damp or some deliberate hand has not been entirely kind. The first word is perfectly legible: THEODRIC. The second has corroded past any certainty beyond the fact that the last name begins with what appears to be A.",
          "Tucked into the recess beside the ruined portrait, scarcely larger than your palm, lies a small diary, its leather cover softened by whatever damp has reached this close against the wall."
        ]);
      }
      return;
    }

    var takeDiaryMatch = /^(?:take|get|grab)\s+(?:the\s+)?diary$/.test(low);
    if (current === "gallery" && galleryFrameOpened && takeDiaryMatch && itemLocation.diary === "gallery"){
      if (diaryTaken){
        respond(["You already have it."]);
      } else {
        diaryTaken = true;
        saveMilestoneIfSignedIn();
        renderRoom(current);
        respond(["You lift the diary free of the recess. Lighter than you expected, and no less damp for having waited there so long."]);
      }
      return;
    }

    var takeItemElsewhereMatch = low.match(/^(?:take|get|grab)\s+(?:the\s+)?(quill|document|paper|deed|scroll|button|buckle|bead|jade|spoon|coin|corkscrew|diary|banana)$/);
    if (takeItemElsewhereMatch){
      var takeKey = ITEM_NOUN_TO_KEY[takeItemElsewhereMatch[1]];
      if (getItemTaken(takeKey)){
        respond(["You already have it."]);
        return;
      }
      if (isItemRevealed(takeKey) && itemLocation[takeKey] === current){
        setItemTaken(takeKey, true);
        saveMilestoneIfSignedIn();
        renderRoom(current);
        respond(["You pick it up."]);
        return;
      }
    }

    var openDiaryMatch = /^(?:open|read)\s+(?:the\s+)?diary$/.test(low);
    if (current === "gallery" && galleryFrameOpened && openDiaryMatch){
      if (!diaryTaken){
        respond(["You have no diary in hand."]);
      } else {
        diaryOpen = true;
        diaryPage = 0;
        respond([diaryPageHTML(diaryPage)]);
      }
      return;
    }

    var turnPageMatch = /^(?:(?:turn|flip)(?:\s+to)?\s+(?:the\s+)?(?:next\s+)?page|next\s+page)$/.test(low);
    var gotoPageMatch = low.match(/^page\s+(\d+)$/);
    if (current === "gallery" && (turnPageMatch || gotoPageMatch)){
      if (!diaryOpen){
        respond(["There is nothing open to turn the page of."]);
      } else if (gotoPageMatch){
        var requestedPage = parseInt(gotoPageMatch[1], 10);
        if (requestedPage < 1 || requestedPage > DIARY_PAGES.length){
          respond(["The diary has no page " + requestedPage + "."]);
        } else {
          diaryPage = requestedPage - 1;
          respond([diaryPageHTML(diaryPage)]);
        }
      } else {
        diaryPage = (diaryPage + 1) % DIARY_PAGES.length;
        respond([diaryPageHTML(diaryPage)]);
      }
      return;
    }

    var feelDoorMatch = low.match(/^(?:feel|touch)\s+(?:the\s+)?(?:door|mirror)\s*(\d+)$/);
    if (current === "mirror_hall" && feelDoorMatch){
      var feltNum = parseInt(feelDoorMatch[1], 10);
      if (feltNum < 1 || feltNum > 8){
        respond(["There is no door numbered that here."]);
      } else if (feltNum === CORRECT_DOOR){
        respond(["The glass is warm beneath your palm."]);
      } else {
        respond(["The glass of door " + feltNum + " is cold beneath your palm, cold as every other surface in this house has been."]);
      }
      return;
    }

    var openDoorMatch = low.match(/^open\s+(?:the\s+)?(?:door|mirror)\s*(\d+)$/);
    if (current === "mirror_hall" && openDoorMatch){
      var openedNum = parseInt(openDoorMatch[1], 10);
      if (openedNum < 1 || openedNum > 8){
        respond(["There is no door numbered that here."]);
      } else {
        respond(["There is no latch here, no hinge — nothing to open. If you mean to go through that door, you must simply go through."]);
      }
      return;
    }

    var goDoorMatch = low.match(/^(?:go\s+through|through|enter|exit)\s+(?:the\s+)?door\s*(\d+)$/);
    if (current === "mirror_hall" && goDoorMatch){
      var chosenDoor = parseInt(goDoorMatch[1], 10);
      if (chosenDoor < 1 || chosenDoor > 8){
        respond(["There is no door numbered that here."]);
      } else if (chosenDoor === CORRECT_DOOR){
        solved.mirrors = true;
        updateStatus();
        turnTo("furnace_room",
          ["You push through, and for one unsteady instant the glass gives like water rather than breaking like glass — and then you are through."],
          [
            "<span class=\"system\">— Spell broken: the Hall of Mirrors — " + remainingLine() + " —</span>",
            "<span class=\"jewel-found\">A jewel, small and bright, slips loose behind you, ringing once, sharp and clear, against the stone at your feet.</span>"
          ],
          true
        );
      } else {
        turnTo("maze_hub", [
          "The glass gives the same way — water, not glass — and for one instant you believe yourself safely through. Then the air changes, all at once, and you understand, the way you have come to understand so much else in this house, that you have chosen badly."
        ]);
      }
      return;
    }

    var dialMatch = low.match(/^(?:turn|set|dial|enter|configure|move)\D*(\d{3,4})/);
    if (current === "churchyard" && dialMatch){
      var yr = dialMatch[1];
      if (yr === "1347" && !solved.dial){ dialSolved(); }
      else if (solved.dial){ respond(["The door already stands open."]); }
      else { dialWrong(); }
      return;
    }

    var pullRingsMatch = /^pull\s+(?:the\s+)?rings?$/.test(low);
    if (current === "sentinels_hall" && pullRingsMatch){
      if (solved.helmets){
        respond(["The rings already hang loose and pulled; the niche behind them stands open."]);
      } else {
        respond(["You take hold and pull with everything you have. The ring does not so much as shift. It appears you are just not strong enough."]);
      }
      return;
    }

    var cleanVisorMatch = low.match(/^(?:clean|wipe)\s+(?:the\s+)?(red|blue|green|yellow|black|gold)(?:\s+visor)?$/);
    if (current === "sentinels_hall" && cleanVisorMatch){
      awaitingVisorColor = false;
      cleanVisor(cleanVisorMatch[1]);
      return;
    }

    var cleanVisorNoColorMatch = /^(?:clean|wipe)\s+(?:the\s+)?(?:visor|helmet)s?$/.test(low);
    if (current === "sentinels_hall" && cleanVisorNoColorMatch){
      if (solved.helmets){ respond(["The niche stands open already. There is nothing left here to clean."]); }
      else {
        awaitingVisorColor = true;
        var remaining = Object.keys(visorClean).filter(function(c){ return !visorClean[c]; });
        respond(["Which one? Dust-blind still: " + remaining.join(", ") + "."]);
      }
      return;
    }

    var chestMatch = low.match(/^(?:turn|set)\s+dials?\s+to\s+([a-z]+)$/) || low.match(/^turn\s+to\s+([a-z]+)$/) || low.match(/^spell\s+([a-z]+)$/) || low.match(/^dial\s+([a-z]+)$/);
    if (current === "muster_hall" && chestMatch){
      var chestWord = chestMatch[1].toUpperCase();
      if (solved.chest){ respond(["The chest already stands open."]); }
      else if (chestWord === "COURAGE"){ chestSolved(); }
      else { chestWrong(); }
      return;
    }

    var writeMatch = low.match(/^(?:write|sign)\s+(?:my\s+name\s+as\s+)?(.+)$/);
    if (current === "gallery" && writeMatch){
      if (!quillTaken){
        respond(["With what?"]);
        return;
      }
      var writtenName = writeMatch[1].trim().replace(/[.!]+$/,"").replace(/\s+/g," ");
      if (solved.document){
        respond(["The document already bears its name. There is nothing more to write."]);
      } else if (writtenName === "theodric"){
        respond(["“THEODRIC who?”"]);
      } else if (writtenName === "theodric ashgrave"){
        documentSolved();
      } else {
        documentWrong();
      }
      return;
    }

    if (tryExamine(raw)) return;

    // movement
    var dirWord = null;
    var goMatch = low.match(/^(?:go\s+)?(n|north|s|south|e|east|w|west|u|up|d|down|in|enter|out|exit|leave)$/);
    var enterGateMatch = /^(enter gate|through gate|open gate|go through gate)$/.test(low);
    var enterChapelMatch = /^(enter chapel|through chapel|open chapel door|open door|go through chapel)$/.test(low);
    var enterServantsDoorMatch = /^(?:enter|go through|through|open)\s+(?:the\s+)?(?:servant'?s?\s+)?door$/.test(low);

    if (enterGateMatch && current === "gate") dirWord = "east";
    else if (enterChapelMatch && current === "churchyard") dirWord = "east";
    else if (enterServantsDoorMatch && current === "grounds") dirWord = "east";
    else if (goMatch) dirWord = DIR_WORDS[goMatch[1]];

    if (dirWord){
      if (current === "gate" && dirWord === "east"){
        if (solved.ogre){ turnTo("grounds"); }
        else { ogreChallenge(); }
        return;
      }
      if (current === "gate" && dirWord === "north"){
        if (solved.ogre){ turnTo("footpath"); }
        else { respond(["Whatever waits down that path can wait a little longer. You are not leaving this gate with the ogre still unanswered."]); }
        return;
      }
      if (current === "churchyard" && dirWord === "east"){
        if (solved.dial){ turnTo("chapel"); }
        else { respond(["The dial has not been set. The door does not move."]); }
        return;
      }
      if (current === "sentinels_hall" && dirWord === "west"){
        if (solved.helmets){ turnTo("muster_hall"); }
        else { respond(["You are leaving dust-blind visors behind. Whatever these six are waiting to do together, they have not yet done it."]); }
        return;
      }
      if (current === "gallery" && dirWord === "north"){
        if (solved.document){
          turnTo("mirror_hall", ROOMS.gallery.onEnterExit.north);
        } else {
          respond(["Whatever waits beyond that door, you find yourself unwilling to leave this room with its one true task still undone."]);
        }
        return;
      }
      if (current === "great_hall" && dirWord === "up"){
        if (allNineJewelsAccountedFor()){
          turnTo("tower_stair");
        } else {
          respond([ROOMS.great_hall.blocked.up]);
        }
        return;
      }
      if (current === "king_chamber" && dirWord === "up"){
        if (solved.finale){
          turnTo("treasure_room");
        } else {
          respond([ROOMS.king_chamber.blocked.up]);
        }
        return;
      }
      if (current === "king_chamber" && dirWord === "down" && !solved.finale){
        turnTo("tower_door", [
          "As you turn to leave, a wave of euphoria washes over you, sudden and complete — relief, vindication, the warm conviction that you have done enough and may rightly rest now. It feels earned. It is not. Like everything else this presence has pressed upon you, it is aimed, not felt — a comfort arriving far too conveniently to be trusted."
        ]);
        return;
      }
      if (current === "atrium_n" && solved.magpie && !inventory.magpie && atriumLeaveWarnings < 2 && (dirWord === "south" || dirWord === "west" || dirWord === "east" || dirWord === "north")){
        atriumLeaveWarnings++;
        respond(["Aren't you forgetting something?"]);
        return;
      }

      var room = ROOMS[current];
      if (room.blocked && room.blocked[dirWord]){
        respond([room.blocked[dirWord]]);
        return;
      }
      if (room.exits && room.exits[dirWord]){
        var extra = (room.onEnterExit && room.onEnterExit[dirWord]) ? room.onEnterExit[dirWord].slice() : [];
        var leavingKey = jewelKeyHere();
        if (room.leaveUnclaimedJewel && leavingKey && !inventory[leavingKey]){
          extra = extra.concat([room.leaveUnclaimedJewel]);
        }
        turnTo(room.exits[dirWord], extra.length ? extra : null);
        return;
      }
      respond(["There is no way to go " + dirWord + " from here."]);
      return;
    }

    // riddle answer fallback
    if (current === "gate" && awaitingOgre){
      if (/\bfire\b/i.test(low)){ ogreSolved(); }
      else { ogreWrong(); }
      return;
    }

    // "wish for what?" follow-up answer fallback
    if (current === "cellar" && awaitingWish){
      awaitingWish = false;
      grantWishIfValid(raw);
      return;
    }

    // "which one?" follow-up color fallback for the sentinels' hall visors
    var bareVisorColorMatch = low.match(/^(?:the\s+)?(red|blue|green|yellow|black|gold)(?:\s+visor)?$/);
    if (current === "sentinels_hall" && awaitingVisorColor && bareVisorColorMatch){
      awaitingVisorColor = false;
      cleanVisor(bareVisorColorMatch[1]);
      return;
    }

    // bare single-word guess fallback for the muster hall's chest dial
    if (current === "muster_hall" && !solved.chest && /^[a-z]+$/.test(low)){
      if (low === "courage"){ chestSolved(); }
      else { chestWrong(); }
      return;
    }

    respond(["I know not what you mean."]);
  }

  form.addEventListener("submit", function(ev){
    ev.preventDefault();
    var v = input.value;
    input.value = "";
    runCommand(v);
  });

  window.addEventListener("pagehide", function(){
    if (mode === "play" && avatarName){
      saveProgressToServer("pagehide");
    }
  });

  function authErrorMessage(code){
    switch(code){
      case "invalid_format": return "Names of three to twenty letters, good traveller — numbers, spaces, and a few marks are welcome, but little else.";
      case "name_rejected": return "The herald's quill simply refuses to write such a name. Choose another.";
      case "name_taken": return "A soul by that name already walks these halls. Choose another.";
      case "invalid_email": return "The herald needs a proper address to send word to, should you ever need it.";
      case "email_taken": return "That email is already recorded under another name.";
      case "weak_password": return "Choose a password of at least 8 characters that isn't easy to guess.";
      case "invalid_credentials": return "Name or password not recognised.";
      case "rate_limited": return "Too many attempts. Wait a moment and try again.";
      case "invalid_or_expired_token": return "That link is invalid or has expired. Request a new one.";
      case "network_error": return "The herald's ledger cannot be reached just now. Try again shortly.";
      default: return "Something has gone amiss. Try again shortly.";
    }
  }

  Object.keys(AUTH_FORMS).forEach(function(viewKey){
    var links = AUTH_FORMS[viewKey].querySelectorAll("[data-auth-view]");
    for (var i=0;i<links.length;i++){
      links[i].addEventListener("click", function(ev){
        ev.preventDefault();
        showAuthView(ev.target.getAttribute("data-auth-view"));
      });
    }
  });

  authPanel.querySelectorAll(".password-toggle").forEach(function(btn){
    btn.addEventListener("click", function(){
      var input = btn.previousElementSibling;
      if (!input) return;
      var revealed = input.type === "text";
      input.type = revealed ? "password" : "text";
      input.classList.toggle("password-revealed", !revealed);
      btn.textContent = revealed ? "👁" : "🙈";
      btn.setAttribute("aria-label", revealed ? "Show password" : "Hide password");
    });
  });

  AUTH_FORMS.signup.addEventListener("submit", function(ev){
    ev.preventDefault();
    if (authBusy) return;
    var f = ev.target;
    var name = f.avatar_name.value;
    var email = f.email.value;
    var password = f.password.value;
    var confirm = f.confirm_password.value;
    var remember = f.remember.checked;

    if (password !== confirm){
      authMessageEl.textContent = "Passwords do not match.";
      return;
    }

    setAuthBusy(true, "The herald dips his quill...");
    postWyrmspire("/wyrmspire-signup", {avatar_name:name, email:email, password:password}).then(function(result){
      setAuthBusy(false);
      if (result.ok){
        applyAuthSuccess(result.data, remember, ["The herald inscribes <strong>" + escapeHtml(result.data.avatar_name) + "</strong> upon the rolls, and waves you through."]);
      } else {
        authMessageEl.textContent = authErrorMessage(result.data.code);
      }
    });
  });

  AUTH_FORMS.login.addEventListener("submit", function(ev){
    ev.preventDefault();
    if (authBusy) return;
    var f = ev.target;
    var name = f.avatar_name.value;
    var password = f.password.value;
    var remember = f.remember.checked;

    setAuthBusy(true, "The herald consults the rolls...");
    postWyrmspire("/wyrmspire-login", {avatar_name:name, password:password}).then(function(result){
      setAuthBusy(false);
      if (result.ok){
        applyAuthSuccess(result.data, remember, ["Welcome back, <strong>" + escapeHtml(result.data.avatar_name) + "</strong>."]);
      } else {
        authMessageEl.textContent = authErrorMessage(result.data.code);
      }
    });
  });

  AUTH_FORMS.forgotName.addEventListener("submit", function(ev){
    ev.preventDefault();
    if (authBusy) return;
    var email = ev.target.email.value;
    setAuthBusy(true, "The herald checks the rolls...");
    postWyrmspire("/wyrmspire-forgot-name", {email:email}).then(function(){
      setAuthBusy(false);
      authMessageEl.textContent = "If that address is on file, a letter naming your avatar is on its way.";
    });
  });

  AUTH_FORMS.forgotPassword.addEventListener("submit", function(ev){
    ev.preventDefault();
    if (authBusy) return;
    var identifier = ev.target.identifier.value;
    setAuthBusy(true, "The herald checks the rolls...");
    postWyrmspire("/wyrmspire-forgot-password", {identifier:identifier}).then(function(){
      setAuthBusy(false);
      authMessageEl.textContent = "If that name or email is on file, a letter is on its way to the registered address.";
    });
  });

  AUTH_FORMS.resetPassword.addEventListener("submit", function(ev){
    ev.preventDefault();
    if (authBusy) return;
    var f = ev.target;
    var password = f.password.value;
    var confirm = f.confirm_password.value;

    if (password !== confirm){
      authMessageEl.textContent = "Passwords do not match.";
      return;
    }
    if (!pendingResetToken){
      authMessageEl.textContent = "That reset link is missing its token.";
      return;
    }

    setAuthBusy(true, "The herald writes it down...");
    postWyrmspire("/wyrmspire-reset-password", {token:pendingResetToken, password:password}).then(function(result){
      setAuthBusy(false);
      if (result.ok){
        pendingResetToken = null;
        applyAuthSuccess(result.data, true, ["Your password is reset. Welcome back, <strong>" + escapeHtml(result.data.avatar_name) + "</strong>."]);
      } else {
        authMessageEl.textContent = authErrorMessage(result.data.code);
      }
    });
  });

  prizeClaimForm.addEventListener("submit", function(ev){
    ev.preventDefault();
    if (prizeClaimBusy) return;
    var f = ev.target;
    var selectedPrizeInput = f.querySelector("input[name=selected_prize]:checked");
    var selectedPrize = selectedPrizeInput ? selectedPrizeInput.value : "";
    var winnerName = f.winner_name.value;
    var mailingAddress = f.mailing_address.value;

    if (!selectedPrize){
      prizeClaimMessageEl.textContent = "Please choose a prize.";
      return;
    }

    prizeClaimBusy = true;
    prizeClaimMessageEl.textContent = "Recording your claim...";
    postWyrmspire("/wyrmspire-claim-prize", {
      avatar_name: avatarName,
      save_token: saveToken,
      selected_prize: selectedPrize,
      winner_name: winnerName,
      mailing_address: mailingAddress
    }).then(function(result){
      prizeClaimBusy = false;
      if (result.ok){
        prizeClaimed = true;
        hidePrizeClaimPanel();
        mode = "play";
        respond(["Your claim is recorded — " + escapeHtml(selectedPrize) + " will be on its way to you. Thank you for playing Wyrmspire Hall!"]);
        renderExits();
      } else if (result.data && result.data.code === "already_claimed"){
        prizeClaimed = true;
        hidePrizeClaimPanel();
        mode = "play";
        respond(["A prize has already been recorded for your account — thank you for playing Wyrmspire Hall!"]);
        renderExits();
      } else {
        prizeClaimMessageEl.textContent = "Something went wrong recording your claim. Please try again.";
      }
    });
  });

  // boot: show the intro page (or jump straight to a password reset, if we arrived via a reset link)
  var resetHashMatch = location.hash.match(/^#reset=([A-Za-z0-9_-]{20,64})$/);
  if (resetHashMatch){
    pendingResetToken = resetHashMatch[1];
    history.replaceState(null, "", location.pathname + location.search);
  }

  updateStatus();
  turnTo("intro");
  if (pendingResetToken){
    renderRoom("naming");
    showAuthView("resetPassword", "Choose a new password.");
  }
  input.focus();
})();
</script>
</body>
</html>
