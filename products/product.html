<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting... | Hollywood East Autographs & Collectibles</title>
  <meta name="robots" content="noindex, follow">
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var id = params.get("id");

      if (id) {
        window.location.replace(id.toLowerCase() + ".html");
      } else {
        window.location.replace("../catalog.html");
      }
    })();
  </script>
</head>

<body>
  <p>
    <a id="fallback-link" href="../catalog.html">Continue to the catalog</a>
  </p>
</body>
</html>
