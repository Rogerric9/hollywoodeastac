<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample Signed Photograph | Hollywood East</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

  <header>
    <h1>Hollywood East Autographs & Collectibles</h1>
    <p>Authentic autographs from film, television, music, sports, and history</p>

    <nav>
      <a href="../index.html">Home</a>
      <a href="../catalog.html">Catalog</a>
      <a href="../cart.html">Cart</a>
      <a href="../ordering.html">Ordering</a>
      <a href="../about.html">About Us</a>
      <a href="../contact.html">Contact</a>
    </nav>

  </header>

  <main>
  <section class="product-detail">

    <div class="product-image-viewer">
      <button id="previous-image" class="image-arrow" type="button">&#10094;</button>

      <img id="main-product-image"
           src=""
           alt="Product image">

      <button id="next-image" class="image-arrow" type="button">&#10095;</button>
    </div>

    <div class="product-information">
      <h2 id="product-name"></h2>

      <p id="product-number" class="product-number"></p>

      <p id="product-price" class="product-price"></p>

      <div id="product-description"></div>

      <div id="product-authentication"></div>

      <div id="product-condition"></div>

      <div id="product-miscellaneous"></div>
    
      <button id="add-to-cart-button" type="button">
        Add to Cart
      </button>

      <p>
        <a class="back-link" href="../cart.html">View Cart</a>
      </p>

      <p>
        <a class="back-link" href="../catalog.html">Return to Catalog</a>
      </p>

    </div>

  </section>
</main>
  <footer>
    <p>&copy; 2026 Hollywood East Autographs & Collectibles</p>
  </footer>

  <script src="../inventory.js?v=3"></script>
  <script src="../details.js?v=3"></script>
  <script src="../product-detail.js?v=3"></script>

</body>
