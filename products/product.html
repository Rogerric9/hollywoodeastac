<body>

  <header>
    <h1>Hollywood East Autographs & Collectibles</h1>
    <p>Authentic autographs from film, television, music, sports, and history</p>

    <nav>
      <a href="../index.html">Home</a>
      <a href="../catalog.html">Catalog</a>
      <a href="../cart.html" class="cart-menu-link" aria-label="Shopping cart">
        <span class="cart-icon">
          <svg class="cart-svg" viewBox="0 0 64 64" aria-hidden="true">
            <path d="M12 18l7 24h30l7-24"></path>
            <circle cx="25" cy="51" r="4"></circle>
            <circle cx="47" cy="51" r="4"></circle>
          </svg>

  <main>
<section class="product-detail">
<div class="product-image-column">

  <div class="product-image-viewer">
    <button id="previous-image" class="image-arrow" type="button">
      &#10094;
    </button>

    <img id="main-product-image"
      src=""
      alt="Product image"
      onerror="this.onerror=null; this.src='../images/no-image-available.jpg';">

    <button id="next-image" class="image-arrow" type="button">
      &#10095;
    </button>
  </div>
  <div class="product-lower-row">

    <div class="product-page-buttons">
      <button id="add-to-cart-button" type="button">
        Add to Cart
      </button>

      <p>
        <a class="back-link" href="../cart.html">View Cart</a>
      </p>

      <p>
        <a class="back-link" href="../catalog.html">
          Return to Catalog
        </a>
      </p>
    </div>

    <div id="product-miscellaneous"></div>

  </div>

</div>


<div class="product-information">
    <h2 id="product-name"></h2>

    <p id="product-number" class="product-number"></p>

    <p id="product-price" class="product-price"></p>

    <p id="product-shipping" class="product-shipping"></p>

    <div id="product-description"></div>
    <div id="product-authentication"></div>

    <div id="product-condition"></div>
</div>

</section>

</main>
  <footer>
    <p>&copy; 2026 Hollywood East Autographs & Collectibles</p>
