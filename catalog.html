<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalog | Hollywood East Autographs & Collectibles</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <header>
    <h1>Hollywood East Autographs & Collectibles</h1>
    <p>Authentic autographs from film, television, music, sports, and history</p>

    <nav>
      <a href="index.html">Home</a>

      <div class="catalog-menu">
        <a href="catalog.html?type=autograph" id="catalog-menu-link">Autographs</a>
        <div id="category-dropdown" class="category-dropdown"></div>
      </div>

      <a href="catalog.html?type=collectible">Collectibles</a>
      <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
      <a href="about.html">About Us</a>
    </nav>
  </header>

  <main>
    <section>
      <h2 id="category-heading"></h2>

      <p id="catalog-description"></p>

      <div class="catalog-search-area">
        <label for="catalog-search">Search by name:</label>

        <input
          type="text"
          id="catalog-search"
          placeholder="Example: Bob Dylan"
        >

        <button id="catalog-search-button" type="button" aria-label="Search">
          🔍
        </button>
      </div>

      <div id="product-grid" class="product-grid"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Hollywood East Autographs & Collectibles</p>
  </footer>

  <script src="inventory.js"></script>
  <script src="details.js"></script>
  <script src="catalog.js"></script>
  <script src="menu.js"></script>

</body>
</html>
